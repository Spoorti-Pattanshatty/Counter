<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter_container">
        <h1>COUNTER</h1>
        <h2 id="count">0</h2>
        <button class="btn decrease" onclick="decrease()">Decrease</button>
        <button class="btn reset" onclick="reset()">Reset</button>
        <button class="btn increase" onclick="increase()">Increase</button>
    </div>    
</body>
<script src="index.js"></script>
</html>
